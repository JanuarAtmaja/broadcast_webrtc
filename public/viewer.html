<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Viewer</title>
 <style>
 body { font-family: sans-serif; padding: 20px; }
 video { width: 100%; max-width: 600px; border: 2px solid #333; }
 input, button { padding: 10px; font-size: 1em; }
 </style>
</head>
<body>
 <h1>Viewer 📺</h1>
 <div>
 <input type="text" id="tokenInput" placeholder="Masukkan Token">
 <button id="joinBtn">Join</button>
 </div>
 <hr>
 <video id="remoteVideo" autoplay playsinline muted></video>
 <script src="/socket.io/socket.io.js"></script>
 <script type="module" src="main.js"></script>
 <script type="module">
 import { startView } from './main.js';
 document.getElementById('joinBtn').addEventListener('click', () => {
 const roomId = document.getElementById('tokenInput').value;
 if (roomId) startView(roomId);
 });
 </script>
</body>
</html>
